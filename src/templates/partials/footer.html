    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <a href="{{_nav_home_url}}" class="logo">clewbyte<span>.</span></a>
                    <p>{{footer.brand_description}}</p>
                </div>
                <div>
                    <h4>{{footer.navigation}}</h4>
                    <div class="footer-links">
                        <a href="{{_nav_home_url}}">{{nav.home}}</a>
                        <a href="{{_nav_floorisplan_url}}">{{nav.floorisplan}}</a>
                        <a href="{{_nav_contacts_url}}">{{nav.contacts}}</a>
                    </div>
                </div>
                <div>
                    <h4>{{footer.legal}}</h4>
                    <div class="footer-links">
                        <a href="{{_privacy_url}}">{{footer.privacy_policy}}</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <span>{{footer.copyright}}</span>
                <span class="email-obfuscated-text"></span>
            </div>
        </div>
    </footer>

    <!-- Cookie consent. Hidden until js/analytics.js decides it is needed:
         no Google tag configured or a stored choice means it never appears. -->
    <div class="cookie-banner" id="cookieBanner" role="dialog" aria-live="polite"
         aria-label="{{cookies.aria}}" hidden>
        <div class="cookie-banner-inner">
            <p class="cookie-banner-text">
                {{cookies.text}}
                <a href="{{_privacy_url}}">{{cookies.more}}</a>
            </p>
            <div class="cookie-banner-actions">
                <button type="button" class="btn btn-secondary" id="cookieDecline">{{cookies.decline}}</button>
                <button type="button" class="btn btn-primary" id="cookieAccept">{{cookies.accept}}</button>
            </div>
        </div>
    </div>
